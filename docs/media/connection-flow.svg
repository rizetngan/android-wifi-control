<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="320" viewBox="0 0 1120 320" role="img" aria-labelledby="t d"><title id="t">从首次配对到日常使用</title><desc id="d">首次安卓确认授权，之后保存设备并在程序打开期间检查 TLS 重连。</desc><rect width="1120" height="320" rx="22" fill="#f2f4f7"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="42" y="52" font-size="26" font-weight="700" fill="#172339">配对一次，后续少做重复操作</text><text x="42" y="80" font-size="14" fill="#52637a">Android 11+ · 同一可信局域网 · 已授权设备</text>
<g transform="translate(42 106)"><rect width="240" height="150" rx="12" fill="white" stroke="#d8e0eb"/><text x="20" y="31" font-size="12" font-weight="700" fill="#255bd8">01 / 首次</text><text x="20" y="66" font-size="21" font-weight="700" fill="#172339">设备端确认</text><text x="20" y="98" font-size="15" fill="#52637a">开启无线调试</text><text x="20" y="120" font-size="15" fill="#52637a">输入配对码</text></g>
<g transform="translate(307 106)"><rect width="240" height="150" rx="12" fill="white" stroke="#d8e0eb"/><text x="20" y="31" font-size="12" font-weight="700" fill="#255bd8">02 / 连接</text><text x="20" y="66" font-size="21" font-weight="700" fill="#172339">识别并保存</text><text x="20" y="98" font-size="15" fill="#52637a">发现地址、读取型号</text><text x="20" y="120" font-size="15" fill="#52637a">保存常用设备</text></g>
<g transform="translate(572 106)"><rect width="240" height="150" rx="12" fill="#255bd8"/><text x="20" y="31" font-size="12" font-weight="700" fill="#cbdcff">03 / 日常</text><text x="20" y="66" font-size="21" font-weight="700" fill="white">双击打开控制</text><text x="20" y="98" font-size="15" fill="#e3edff">scrcpy 实时显示</text><text x="20" y="120" font-size="15" fill="#e3edff">电脑键鼠操作</text></g>
<g transform="translate(837 106)"><rect width="240" height="150" rx="12" fill="white" stroke="#d8e0eb"/><text x="20" y="31" font-size="12" font-weight="700" fill="#255bd8">04 / 恢复</text><text x="20" y="66" font-size="21" font-weight="700" fill="#172339">重新发现 TLS</text><text x="20" y="98" font-size="15" fill="#52637a">窗口开启时检查</text><text x="20" y="120" font-size="15" fill="#52637a">尝试连接已保存设备</text></g>
<g stroke="#8291a5" stroke-width="2" fill="none" stroke-linecap="round"><path d="M286 181h17l-6-5m6 5-6 5"/><path d="M551 181h17l-6-5m6 5-6 5"/><path d="M816 181h17l-6-5m6 5-6 5"/></g><text x="42" y="293" font-size="13" fill="#52637a">如果系统关闭无线调试、网络不可达或撤销授权，仍需设备端处理；恢复连接不等于自动重开投屏窗口。</text></g></svg>